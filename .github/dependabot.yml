version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Chicago
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      python-qa-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  # Audio production moved to murderbird-uncaged as a preserved source archive.
  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: "08:30"
      timezone: America/Chicago
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      browser-qa-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: "08:45"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    groups:
      github-actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
