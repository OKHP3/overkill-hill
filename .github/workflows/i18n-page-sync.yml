name: i18n Page Sync

# Detects drift between English source pages and their configured
# translations. Never translates, never writes, never calls an external
# API. Copy this file into a consuming repository's .github/workflows/ as
# i18n-page-sync.yml.
#
# If the repository has no i18n/sync.config.json yet, this job passes
# instantly and says so -- adding this workflow to a repository that has
# not started translating is safe and does nothing until that config file
# exists. See okhp3-i18n-page-sync's references/config-schema.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-page-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check translated pages are present and current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.1'

      - name: Run published-locale release gate
        run: python3 scripts/check-i18n-release.py --mode check --format json

      - name: What to do next
        if: failure()
        run: |
          echo "A published-locale route is missing or stale. The JSON report"
          echo "also retains advisory drift for draft locales. For French:"
          echo "1. Run the named exact-pair skill and complete the authorized"
          echo "   semantic/terminology review."
          echo "2. Record reviewed provenance for the exact locale and routes."
          echo "3. Use the site wrapper with explicit French locales, routes,"
          echo "   and provenance before adopting the baseline."
          echo "   python3 scripts/check-i18n-release.py --mode adopt --locales fr --routes \"<route>\" --provenance \"<record>\""
          exit 1
