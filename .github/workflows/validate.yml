name: Site Validation

on:
  workflow_call:
    outputs:
      release_artifact_name:
        description: Exact artifact produced by the successful validation attempt
        value: ${{ jobs.validate.outputs.release_artifact_name }}
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Validate site HTML, links, and structure
    if: github.event_name != 'schedule'
    env:
      THEME_CONTROL_OKH_REVISION: 0ee6bc875a183ca2e065448d01fe97da62fc1ff7
      THEME_CONTROL_GLEE_REVISION: f5689fe4852b72e5d584db9d8f87cac9121b87c4
      THEME_CONTROL_ASKJAMIE_REVISION: e800d4aebf0dc2543c5ced295ec78d10ba192473
    outputs:
      release_artifact_name: validated-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    # Cancel obsolete PR validation only. Caller names separate reusable runs;
    # push/dispatch run IDs keep retries from canceling another release.
    concurrency:
      group: site-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pull request head for contrast mapping
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-head

      - name: Record reviewed theme-control revisions
        run: |
          cat <<EOF | tee theme-control-revisions.txt
          Theme-control audit foundation revisions
          OKH       ${THEME_CONTROL_OKH_REVISION}  (OKHP3/OverKill-Hill)
          Glee      ${THEME_CONTROL_GLEE_REVISION}  (OKHP3/Glee-fullyTools)
          AskJamie  ${THEME_CONTROL_ASKJAMIE_REVISION}  (OKHP3/AskJamie)
          EOF
          cat theme-control-revisions.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pinned theme-control foundation revisions are fetchable
        run: |
          set -euo pipefail

          verify_revision() {
            local site="$1"
            local revision_variable="$2"
            local repository="$3"
            local revision="$4"
            local probe_dir="$RUNNER_TEMP/theme-control-fetch/$site"

            rm -rf "$probe_dir"
            mkdir -p "$probe_dir"
            git -C "$probe_dir" init --quiet
            printf 'Fetching %s (%s=%s) from %s\n' \
              "$site" "$revision_variable" "$revision" "$repository"
            if ! git -C "$probe_dir" fetch --no-tags --depth=1 --filter=tree:0 "$repository" "$revision"; then
              printf 'ERROR: %s (%s=%s) foundation revision could not be fetched from %s.\n' \
                "$site" "$revision_variable" "$revision" "$repository" >&2
              return 1
            fi

            local fetched_revision
            fetched_revision="$(git -C "$probe_dir" rev-parse FETCH_HEAD)"
            if [[ "$fetched_revision" != "$revision" ]]; then
              printf 'ERROR: %s (%s=%s) fetched unexpected revision %s from %s.\n' \
                "$site" "$revision_variable" "$revision" "$fetched_revision" "$repository" >&2
              return 1
            fi
          }

          verify_revision \
            "OKH" \
            "THEME_CONTROL_OKH_REVISION" \
            "$(git remote get-url origin)" \
            "$THEME_CONTROL_OKH_REVISION"
          verify_revision \
            "Glee" \
            "THEME_CONTROL_GLEE_REVISION" \
            "https://github.com/OKHP3/Glee-fullyTools.git" \
            "$THEME_CONTROL_GLEE_REVISION"
          verify_revision \
            "AskJamie" \
            "THEME_CONTROL_ASKJAMIE_REVISION" \
            "https://github.com/OKHP3/AskJamie.git" \
            "$THEME_CONTROL_ASKJAMIE_REVISION"

      - name: Fetch reviewed OKH foundation revision
        run: git fetch --no-tags --depth=1 origin "$THEME_CONTROL_OKH_REVISION"

      - name: Checkout reviewed Glee foundation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OKHP3/Glee-fullyTools
          ref: ${{ env.THEME_CONTROL_GLEE_REVISION }}
          path: .ci/theme-sites/glee-fullytools
          fetch-depth: 1

      - name: Checkout reviewed AskJamie foundation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OKHP3/AskJamie
          ref: ${{ env.THEME_CONTROL_ASKJAMIE_REVISION }}
          path: .ci/theme-sites/askjamie
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-qa.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check committed generated output before regeneration
        run: |
          python3 scripts/build-site.py --check
          python3 scripts/build-search-index.py --check
          python3 scripts/sync-universe-map.py --check

      - name: Regenerate indexed universe navigation
        run: |
          python3 scripts/build-site.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-universe-map.py --check
          python3 tests/test-universe-integration.py
          node tests/test-universe-browser.mjs
          python3 .agents/skills/okhp3-universe-map/tests/test-universe-map.py

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Run committed SEO regression fixtures
        run: |
          python3 scripts/test-seo-fixtures.py
          python3 tests/test-social-card-duplicates.py
          python3 tests/test-release-entrypoints.py

      - name: Run audit portability regressions
        run: python3 tests/test-audit-site-portability.py

      - name: Check the shared public-page boundary
        run: python3 tests/test-public-page-boundary.py

      - name: Test the Pages release boundary
        run: python3 tests/test-release-package.py

      - name: Test Replit static publication boundary
        run: python3 -m unittest tests/test-replit-static-publication.py

      - name: Test preview serving and report storage boundaries
        run: python3 tests/test-preview-server.py

      - name: Keep historical MurderBird review HTML local
        run: python3 tests/test-murderbird-review-boundary.py

      - name: Test Actions reporting and concurrency contracts
        run: |
          python3 tests/test-actions-summary.py
          python3 tests/test-ci-concurrency.py

      - name: Run live-edge asset, image/font MIME, and data-feed regression tests
        run: python3 -m unittest tests/test_verify_live_edge.py

      - name: Run shared-foundation sync safety regressions
        run: python3 -m unittest tests/test-sync-foundation-files.py

      - name: Verify pinned cross-site foundation fingerprints
        run: |
          python3 scripts/sync-foundation-files.py --verify \
            --source-repo overkill-hill \
            --source-revision "$THEME_CONTROL_OKH_REVISION" \
            --repo-path overkill-hill=. \
            --repo-path glee-fullytools=.ci/theme-sites/glee-fullytools \
            --repo-path askjamie=.ci/theme-sites/askjamie \
            --site-revision "overkill-hill=$THEME_CONTROL_OKH_REVISION" \
            --site-revision "glee-fullytools=$THEME_CONTROL_GLEE_REVISION" \
            --site-revision "askjamie=$THEME_CONTROL_ASKJAMIE_REVISION"

      - name: Run published-locale release-gate regressions
        run: python3 -m unittest tests/test-i18n-release.py

      - name: Test regional locale draft protections
        run: python3 -m unittest tests/test-locale-drafts.py

      - name: Test Cloudflare proposal contract
        run: python3 tests/test-cloudflare-header-proposal.py

      - name: Test the Pages translation freshness dependency
        run: python3 tests/test-i18n-workflow.py

      - name: Check current published-locale freshness
        run: python3 scripts/check-i18n-release.py --mode check --format json

      - name: Keep localized homepage heroes aligned
        run: python3 tests/test-homepage-hero-parity.py

      - name: Verify accepted MurderBird still dependencies and placements
        run: |
          python3 scripts/build-murderbird-release-register.py --check --output tests/fixtures/murderbird-still-release-register.json
          python3 tests/test-murderbird-still-release.py
          python3 tests/test-murderbird-png-fallback.py
          python3 tests/test-murderbird-site-lineage.py
          python3 scripts/build-release.py --output .local/murderbird-ci-release --commit "${{ github.sha }}"
          python3 scripts/build-murderbird-release-register.py --check --output tests/fixtures/murderbird-still-release-register.json --package .local/murderbird-ci-release

      - name: Keep reviewed page scaffolds and navigation current
        run: |
          python3 tests/test-review-closeout.py
          python3 tests/test-page-families.py
          python3 tests/test-font-migration.py

      - name: Check regional draft publication boundaries
        run: python3 scripts/check-regional-drafts.py

      - name: Run construction-banner regressions
        run: python3 scripts/test-check-banner.py

      - name: Check public project-status records
        run: |
          python3 scripts/check-project-status.py
          python3 tests/test-project-status.py
          python3 tests/test-project-status-disclosure.py
          python3 tests/test_project_status.py
          python3 tests/test-skillz-forge.py

      - name: Check generated HTML is current
        run: python3 scripts/build-site.py --check

      - name: Check canonical CSP policies and public-page discovery
        run: |
          python3 tests/test_csp_page_discovery.py
          python3 scripts/generate-csp.py --check
          python3 scripts/check-csp.py

      - name: Check search index and universe map are current
        run: |
          python3 scripts/build-search-index.py --check
          python3 scripts/sync-universe-map.py --check

      - name: Check locale release links and coverage
        run: python3 scripts/check-locale-links.py

      - name: Check shared asset fingerprints
        run: |
          python3 tests/test-cache-bust-boundary.py
          python3 scripts/cache-bust.py --check

      - name: Check tracked site sources for unresolved merge markers
        run: python3 tests/test-template-conflict-markers.py

      - name: Check representative first-party asset budgets
        run: |
          python3 scripts/check-performance-budget.py
          python3 -m unittest tests/test-performance-budget.py

      - name: Run comprehensive static audit
        run: python3 scripts/audit-site.py --quiet

      - name: Check internal links and sitemap boundaries
        run: python3 scripts/check-links.py

      - name: Check article external archive destinations
        run: python3 scripts/check-links.py --external-archives

      - name: Check QA inventory and missing-browser regressions
        run: node --test tests/release-qa-inventory.test.mjs tests/responsive-mode.test.mjs

      - name: Check phone-size overflow on every shipped page
        run: |
          python3 server.py > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          npm run test:phone-overflow
          npm run test:responsive
          npm run test:toc

      - name: Upload local QA reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-qa-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/responsive-qa/
            test-results/audit-site/
          if-no-files-found: warn
          retention-days: 7

      - name: Run accessibility QA gate
        run: |
          python3 server.py > accessibility-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          npm run test:accessibility
          node tests/test-capability-transition.mjs

      - name: Run route-wide CSP browser QA
        run: |
          python3 server.py > csp-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          npm run test:csp -- --base-url=http://127.0.0.1:5000
          node tests/test-self-hosted-fonts.mjs --base-url=http://127.0.0.1:5000

      - name: Run CSP fixture regressions
        id: csp-fixtures
        continue-on-error: true
        env:
          CSP_FIXTURE_REPORT: csp-fixture-report.json
        run: npm run test:csp:regressions

      - name: Upload failed CSP fixture report
        if: always() && steps.csp-fixtures.outcome == 'failure'
        id: upload-csp-fixture-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: csp-fixture-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: csp-fixture-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize failed CSP fixture regressions
        if: always() && steps.csp-fixtures.outcome == 'failure'
        run: >-
          node scripts/csp-qa.mjs
          --fixture-summary=csp-fixture-report.json
          --artifact-url="${{ steps.upload-csp-fixture-report.outputs.artifact-url }}"

      - name: Preserve CSP fixture regression failure
        if: always() && steps.csp-fixtures.outcome == 'failure'
        run: exit 1

      - name: Run shared theme-control regressions
        env:
          THEME_CONTROL_SITES: >-
            [{"name":"OKH","root":".","revision":"0ee6bc875a183ca2e065448d01fe97da62fc1ff7"},
            {"name":"Glee","root":".ci/theme-sites/glee-fullytools","revision":"f5689fe4852b72e5d584db9d8f87cac9121b87c4"},
            {"name":"AskJamie","root":".ci/theme-sites/askjamie","revision":"e800d4aebf0dc2543c5ced295ec78d10ba192473"}]
        run: npm run test:theme-controls

      - name: Upload theme-control revision evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: theme-control-revisions-${{ github.run_id }}
          path: theme-control-revisions.txt
          if-no-files-found: error
          retention-days: 30

      - name: Run search and embedded-app regressions
        run: |
          python3 tests/test-search-sections.py
          node --test tests/search-page.test.mjs tests/search-index.test.mjs tests/search-index-locale.test.mjs tests/embed-workflow.test.mjs tests/mermaid-links.test.mjs

      - name: Keep content visible when optional reveal scripts fail
        run: node tests/test-reveal-browser.mjs

      - name: Run WCAG contrast audit
        id: contrast
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          css_path="assets/css/theme.css"
          script_path="assets/scripts/check-contrast.py"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            css_path=".pr-head/assets/css/theme.css"
            # Use the base-branch audit implementation for PRs. The PR CSS is
            # treated as data; fork-modified tooling is never run here.
            if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              printf '%s\n' 'ERROR: could not fetch the trusted contrast checker.' \
                | tee contrast-report.txt
              printf '2\n' > contrast-exit-code.txt
              echo "exit_code=2" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            if ! git show "$BASE_SHA:assets/scripts/check-contrast.py" \
              > "$RUNNER_TEMP/check-contrast.py"; then
              printf '%s\n' 'ERROR: could not load the trusted contrast checker.' \
                | tee contrast-report.txt
              printf '2\n' > contrast-exit-code.txt
              echo "exit_code=2" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            script_path="$RUNNER_TEMP/check-contrast.py"
          fi
          set -o pipefail
          python3 "$script_path" "$css_path" 2>&1 | tee contrast-report.txt
          contrast_exit=$?
          printf '%s\n' "$contrast_exit" > contrast-exit-code.txt
          echo "exit_code=${contrast_exit}" >> "$GITHUB_OUTPUT"
          exit "$contrast_exit"

      - name: Upload contrast audit report for fork pull requests
        if: always() && github.event_name == 'pull_request' && steps.contrast.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contrast-audit-${{ github.run_id }}
          path: |
            contrast-report.txt
            contrast-exit-code.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail if contrast audit failed
        if: always() && steps.contrast.outcome == 'failure'
        run: exit 1

      - name: Build the SHA-bound Pages release artifact
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/build-release.py \
            --output site-release \
            --commit "${{ github.sha }}"

      - name: Upload the validated Pages release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  monitor-third-party-runtime:
    name: Monitor third-party runtime dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: third-party-runtime-monitor-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'schedule' && 'latest' || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout monitored release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install browser health-check dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check deployed third-party runtime dependencies
        id: external-health
        continue-on-error: true
        run: |
          npm run test:csp:external -- \
            --base-url=https://overkillhill.com \
            --report=third-party-runtime-report.json

      - name: Upload third-party runtime inventory
        if: always()
        id: upload-third-party-runtime-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: third-party-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: third-party-runtime-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize external availability and first-party failures
        if: always()
        run: python3 scripts/write-actions-summary.py --kind external --report third-party-runtime-report.json --artifact-url "${{ steps.upload-third-party-runtime-report.outputs.artifact-url }}"

  monitor-live-edge:
    name: Monitor production security and cache policies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: live-edge-monitor-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'schedule' && 'latest' || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout monitored release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Verify production live edge
        id: verify
        continue-on-error: true
        run: |
          python3 scripts/verify-live-edge.py \
            --base https://overkillhill.com \
            --hosting github-pages \
            --accept-blocked \
            --report assets/audit/live-edge-report.json

      - name: Upload live-edge monitoring report
        if: always()
        id: upload-live-edge-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-edge-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets/audit/live-edge-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize content delivery and edge policy
        if: always()
        run: python3 scripts/write-actions-summary.py --kind edge --report assets/audit/live-edge-report.json --artifact-url "${{ steps.upload-live-edge-report.outputs.artifact-url }}"
