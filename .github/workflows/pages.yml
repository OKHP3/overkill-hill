name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the exact release revision
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy validated site to GitHub Pages
    needs: validate
    # Validation may overlap, but Pages deployments themselves must queue so a
    # newer revision cannot cancel an artifact already being released.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout the revision validated by this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      # Consume the producer's output, not this job's run_attempt: a deploy-only
      # retry must reuse the artifact from the earlier successful validation.
      - name: Require a validated artifact identity
        env:
          RELEASE_ARTIFACT_NAME: ${{ needs.validate.outputs.release_artifact_name }}
        run: test -n "$RELEASE_ARTIFACT_NAME"

      - name: Download the exact validated release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.validate.outputs.release_artifact_name }}
          path: site-release

      - name: Verify downloaded release provenance and bytes
        run: |
          python3 scripts/build-release.py \
            --verify \
            --output site-release \
            --commit "${{ github.sha }}"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-release
          # This directory already passed the public allowlist and byte checks.
          # Preserve .well-known endpoints instead of dropping them during tar.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify live edge matches validated release
        env:
          DEPLOYED_ORIGIN: ${{ steps.deployment.outputs.page_url }}
          VALIDATED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/verify-live-edge.py \
            --base "$DEPLOYED_ORIGIN" \
            --expected-commit "$VALIDATED_COMMIT" \
            --hosting github-pages \
            --accept-blocked \
            --report assets/audit/live-edge-report.json

      - name: Upload live-edge release evidence
        if: always()
        id: upload-live-edge-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-edge-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets/audit/live-edge-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize content delivery and edge policy
        if: always()
        run: python3 scripts/write-actions-summary.py --kind edge --report assets/audit/live-edge-report.json --artifact-url "${{ steps.upload-live-edge-report.outputs.artifact-url }}"
