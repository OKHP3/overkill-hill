name: Translation skill tests

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/okhp3-translation-*/**'
      - '.agents/skills/okhp3-i18n-page-sync/**'
      - 'scripts/test-translation-skills.py'
      - 'tests/test-translation-skill-discovery.py'
      - '.github/workflows/translation-skill-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/okhp3-translation-*/**'
      - '.agents/skills/okhp3-i18n-page-sync/**'
      - 'scripts/test-translation-skills.py'
      - 'tests/test-translation-skill-discovery.py'
      - '.github/workflows/translation-skill-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-skill-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.1'
      - name: Test missing and empty suite guards
        run: python3 tests/test-translation-skill-discovery.py
      - name: Discover and run all required translation and detector tests
        run: python3 scripts/test-translation-skills.py
