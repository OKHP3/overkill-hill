<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; script-src 'self' 'unsafe-inline'"
    >
    <title>Non-network CSP block fixture</title>
  </head>
  <body>
    <main>
      <h1>Non-network CSP block fixture</h1>
      <img
        src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
        alt="CSP-blocked data URI"
      >
    </main>
    <script>
      const blob = new Blob(["non-network fixture"], { type: "image/png" });
      const image = document.createElement("img");
      image.alt = "CSP-blocked blob URI";
      image.src = URL.createObjectURL(blob);
      document.querySelector("main").append(image);
    </script>
  </body>
</html>
