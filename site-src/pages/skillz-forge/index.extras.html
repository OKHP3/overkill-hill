<script>
      (function () {
        var SOURCE_URL = 'https://okhp3.github.io/skillz/data/project-summary.json';
        fetch(SOURCE_URL, { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (summary) {
            var headingEl = document.getElementById('skillz-inventory-heading');
            var asOfEl = document.getElementById('skillz-live-as-of');
            var skillCardEl = document.getElementById('skillz-live-skill-card');
            var familyCardEl = document.getElementById('skillz-live-family-card');
            var maturityEl = document.getElementById('skillz-live-maturity-summary');
            if (!Number.isSafeInteger(summary.skillCount) || summary.skillCount <= 0 ||
                !Number.isSafeInteger(summary.familyCount) || summary.familyCount <= 0) {
              throw new Error('Invalid catalog inventory');
            }
            if (headingEl) headingEl.textContent = summary.skillCount + ' public distribution skills across ' + summary.familyCount + ' active families';
            if (skillCardEl) skillCardEl.textContent = summary.skillCount;
            if (familyCardEl) familyCardEl.textContent = summary.familyCount;
            if (asOfEl) asOfEl.textContent = typeof summary.generatedAt === 'string'
              ? 'Source snapshot: ' + summary.generatedAt.slice(0, 10) + '.'
              : 'Source snapshot time unavailable.';
            if (maturityEl && summary.maturityCounts && typeof summary.maturityCounts === 'object') {
              var counts = Object.keys(summary.maturityCounts)
                .filter(function (level) { return Number.isSafeInteger(summary.maturityCounts[level]) && summary.maturityCounts[level] > 0; })
                .map(function (level) { return summary.maturityCounts[level] + ' ' + level; });
              maturityEl.textContent = counts.length ? 'Current contract maturity: ' + counts.join(', ') + '.' : 'Current maturity counts are unavailable.';
            } else if (maturityEl) {
              maturityEl.textContent = 'Current maturity counts are unavailable.';
            }
          })
          .catch(function (err) {
            var asOfEl = document.getElementById('skillz-live-as-of');
            var skillCardEl = document.getElementById('skillz-live-skill-card');
            var familyCardEl = document.getElementById('skillz-live-family-card');
            var maturityEl = document.getElementById('skillz-live-maturity-summary');
            if (asOfEl) asOfEl.textContent = 'The current source snapshot could not be loaded.';
            if (skillCardEl) skillCardEl.textContent = 'Unavailable';
            if (familyCardEl) familyCardEl.textContent = 'Unavailable';
            if (maturityEl) maturityEl.textContent = 'Current maturity counts are unavailable.';
            console.warn('[skillz dossier] could not live-sync counts from project-summary.json:', err);
          });
      })();
    </script>
<script>
      (function () {
        const btn = document.getElementById('reload-btn');
        const iframe = document.getElementById('tool-iframe');
        const overlay = document.getElementById('iframe-overlay');
        const fallback = document.getElementById('iframe-fallback');

        if (!iframe) return;

        var slowTimer = null;

        function showLoading() {
          if (overlay) overlay.classList.remove('loaded');
          if (fallback) fallback.classList.remove('visible');
          clearTimeout(slowTimer);
          slowTimer = setTimeout(function () {
            if (fallback) fallback.classList.add('visible');
          }, 8000);
        }

        function hideLoading() {
          clearTimeout(slowTimer);
          if (overlay) overlay.classList.add('loaded');
          if (fallback) fallback.classList.remove('visible');
        }

        iframe.addEventListener('load', hideLoading);

        if (btn) {
          btn.addEventListener('click', function () {
            showLoading();
            iframe.src = iframe.src;
          });
        }

        showLoading();
      })();
    </script>
